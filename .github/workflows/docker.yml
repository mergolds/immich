name: Docker

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Server Image
    runs-on: ubuntu-latest
    outputs:
      docker_version: ${{ steps.version.outputs.docker_version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve image version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(jq -r '.version' server/package.json)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "server/package.json does not contain a version" >&2
            exit 1
          fi

          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$version" ]]; then
            echo "Git tag $REF_NAME does not match server version v$version" >&2
            exit 1
          fi

          docker_version=${version//+/-}
          if [[ ! "$docker_version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag derived from server version: $docker_version" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "docker_version=$docker_version"
            echo "short_sha=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Server (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            latest=false
          images: |
            ghcr.io/${{ github.repository_owner }}/immich-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.docker_version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/immich-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/immich-server
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_IMAGE=ghcr.io/${{ github.repository_owner }}/immich-server:${{ needs.prepare.outputs.docker_version }}
            BUILD_IMAGE_URL=${{ github.server_url }}/${{ github.repository }}/pkgs/container/immich-server
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
            BUILD_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Server Manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            latest=false
          images: |
            ghcr.io/${{ github.repository_owner }}/immich-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.docker_version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Create and push multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/immich-server
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          shopt -s nullglob
          digests=("$RUNNER_TEMP/digests"/*)
          if (( ${#digests[@]} != 2 )); then
            echo "Expected 2 platform digests, found ${#digests[@]}" >&2
            exit 1
          fi

          for digest in "${digests[@]}"; do
            args+=("$IMAGE@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${args[@]}"
